name: Förbättringsförslag
description: Föreslå ett nytt verktyg, en ny datakälla eller en förbättring
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: Behov
      description: Vilken fråga vill du kunna besvara, och för vem?
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Datakälla
      description: Myndighet, API, länk till specifikation eller dataset på dataportal.se.
  - type: textarea
    id: proposal
    attributes:
      label: Förslag
