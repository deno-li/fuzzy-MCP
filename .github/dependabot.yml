version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # En PR för alla actions, så att kombinationen testas i samma CI-körning.
    groups:
      github-actions:
        patterns: ["*"]
