# Utgående proxy för fuzzy-mcp (docs/ENEO.md avsnitt 2): släpper bara igenom HTTPS (CONNECT till port 443) till
# myndigheternas värdar i docs/DRIFT.md avsnitt 6. Allt annat – andra värdar, IP-adresser, andra portar och okrypterad
# HTTP – får 403. Proxyn ser bara värdnamnet (TLS hela vägen), aldrig sökväg, frågesträng eller svar.

http_port 3128

# -n: matcha bara värdnamnet som klienten angav, aldrig ett namn som slagits upp baklänges från en IP-adress.
acl myndigheter dstdomain -n statistikdatabasen.scb.se geodata.scb.se fohm-app.folkhalsomyndigheten.se
acl myndigheter dstdomain -n api.skolverket.se statistikdatabasen.skolverket.se admin.dataportal.se
acl https_port port 443
acl CONNECT method CONNECT

http_access allow CONNECT https_port myndigheter
http_access deny all

# Kräver organisationen att all trafik går via en egen proxy: avkommentera BÅDA raderna (med er proxys värd och
# port). Utan never_direct går anslutningarna fortfarande direkt.
# cache_peer proxy.kommun.se parent 8080 0 no-query no-digest default
# never_direct allow all

# Ingen cache och inget på disk, så att containern kan vara skrivskyddad och köras som användaren proxy.
cache deny all
# Squid dimensionerar sina tabeller efter gränsen för öppna filer, som i en container kan vara över en miljon och då
# inte ryms i containerns minne. 4 096 räcker gott för en enda klient.
max_filedescriptors 4096
cache_mem 0 MB
pid_filename none
coredump_dir none
# En rad per anslutning (tid, klient, status, värd:port) på stdout; Squids egen logg på stderr.
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
logfile_rotate 0
httpd_suppress_version_string on
# Squid behöver inte mäta svarstider med ICMP (kräver rättigheter som containern inte har).
pinger_enable off
shutdown_lifetime 3 seconds
