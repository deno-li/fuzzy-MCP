version = 1

[[annotations]]
path = [
  "CHANGELOG.md",
  "README.md",
  "uv.lock",
  ".gitignore",
  "PKG-INFO",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Deniz Özer"
SPDX-License-Identifier = "CC0-1.0"

# Testdata: förkortade eller syntetiska svar från myndigheternas öppna API:er.
[[annotations]]
path = ["tests/fixtures/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Deniz Özer; källdata: Skolverket, Statistiska centralbyrån, Folkhälsomyndigheten, Myndigheten för digital förvaltning"
SPDX-License-Identifier = "CC0-1.0"

# Kodlistor och referensdata härledda från myndigheters öppna data (SCB, Skolverket m.fl., CC0 1.0).
[[annotations]]
path = ["src/fuzzy_mcp/reference/data/*.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Deniz Özer; källdata: Statistiska centralbyrån, Skolverket"
SPDX-License-Identifier = "CC0-1.0"

# SS 12000: kodvärden ur SIS standard (implementationsspecifikation 2.1.0), Sambruks EGIL-profil och Skolverkets
# dnp-ss12000; standarden distribueras av SIS. Sammanställningen är CC0, kodvärdena återges som referens.
[[annotations]]
path = ["src/fuzzy_mcp/reference/data/ss12000.json"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Deniz Özer; kodvärden: SS 12000 (SIS), Sambruk (EGIL), Skolverket"
SPDX-License-Identifier = "CC0-1.0"
