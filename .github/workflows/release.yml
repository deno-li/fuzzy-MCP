# Kör hela CI (ci.yml) för commiten, bygger leveranspaketen, kontrollerar dem, attesterar arkivens byggproveniens och
# skapar ett release-UTKAST med paket, kontrollsummor och releasetext.
# Startas för hand från main (Actions → Release → Run workflow). Alla jobb hämtar körningens commit (GITHUB_SHA,
# senaste commit på main när flödet startades), så ingen annan kod körs här. Utkastet publiceras av en människa;
# först då skapas taggen.
name: Release

on:
  workflow_dispatch:

# Actions är låsta till commit-SHA (Dependabot uppdaterar dem). Bara jobbet attest får signera och bara jobbet
# release har skrivrätt.
permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  main:
    name: Starta från main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: if [ "$GITHUB_REF" != refs/heads/main ]; then echo "::error::Starta flödet från main"; exit 1; fi

  # Samma CI som för pull requests, för just den här commiten: Python 3.11–3.14, lint, tester, verktygstabellen,
  # REUSE, paket- och Eneo-kontrollerna. Releasen byggs bara om allt är grönt.
  test:
    name: CI för commiten
    needs: main
    uses: ./.github/workflows/ci.yml

  build:
    name: Bygg och kontrollera paketen
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.meta.outputs.version }}
      commit: ${{ steps.meta.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Version och commit
        id: meta
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then echo "::error::Starta flödet från main"; exit 1; fi
          # Samma commit som testjobbet, även om main har flyttats under tiden.
          commit=$(git rev-parse HEAD)
          if [ "$commit" != "$GITHUB_SHA" ]; then echo "::error::Hämtade $commit, väntade $GITHUB_SHA"; exit 1; fi
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "::error::Ogiltig version '$version'"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "Bygger fuzzy-mcp $version från $commit"
      # Samma kontroll som jobbet release gör, men innan något byggs eller attesteras: en körning som ändå skulle stoppa
      # där lämnar då inga attesteringar för arkiv som aldrig publiceras (#44). Läsrätt räcker för taggar och
      # publicerade releaser; utkast syns bara med skrivrätt och kontrolleras i release (DEVELOPMENT.md).
      - name: Taggen och releasen för versionen finns inte redan
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          tag="v$VERSION"
          # Bara 404 betyder att taggen saknas; alla andra fel stoppar (fail closed).
          if out=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>&1); then
            echo "::error::Taggen $tag finns redan – höj versionen eller ta bort taggen först"; exit 1
          elif [[ "$out" != *"HTTP 404"* ]]; then
            echo "::error::Kunde inte kontrollera om taggen $tag finns"; echo "$out" >&2; exit 1
          fi
          releases=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName')
          if grep -qxF -- "$tag" <<<"$releases"; then
            echo "::error::Det finns redan en release för $tag"; exit 1
          fi
      - name: Byggverktyg (låsta med SHA-256)
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r scripts/build_requirements.txt
      - name: Bygg Windows-paketet
        run: python scripts/build_release.py --platform windows
      - name: Bygg Linux-paketet med container-image
        run: python scripts/build_release.py --platform linux --with-image
      - name: Kontrollera och packa upp de slutliga leveransarkiven
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          shopt -s nullglob
          windows_archives=("release/fuzzy-mcp-$VERSION-windows-py"*.zip)
          linux_archives=("release/fuzzy-mcp-$VERSION-linux-py"*.tar.gz)
          if [ "${#windows_archives[@]}" -ne 1 ] || [ "${#linux_archives[@]}" -ne 1 ]; then
            echo "::error::Väntade exakt ett slutarkiv per plattform"; exit 1
          fi
          # Testerna och releasetexten ska läsa arkivens innehåll, inte byggkatalogerna.
          for archive in "${windows_archives[@]}" "${linux_archives[@]}"; do
            package_dir=${archive%.zip}
            package_dir=${package_dir%.tar.gz}
            rm -rf -- "$package_dir"
          done
          windows_dir=$(python scripts/verify_release.py --archive "${windows_archives[0]}" --out-dir release)
          linux_dir=$(python scripts/verify_release.py --archive "${linux_archives[0]}" --out-dir release)
          echo "WINDOWS_PACKAGE=$windows_dir" >> "$GITHUB_ENV"
          echo "LINUX_PACKAGE=$linux_dir" >> "$GITHUB_ENV"
          echo "RELEASE_VENV=$RUNNER_TEMP/release-venv" >> "$GITHUB_ENV"
      - name: Windows-paketet går att installera offline (pip --dry-run för win_amd64)
        run: |
          cd "$WINDOWS_PACKAGE"
          py=$(basename "$PWD" | sed 's/.*-py//')
          python -m pip install --dry-run --ignore-installed --target "$RUNNER_TEMP/windows-target" --no-index \
            --find-links wheelhouse --require-hashes -r requirements.lock \
            --platform win_amd64 --python-version "$py" --implementation cp --only-binary=:all:
      - name: Linux-paketet – installation utan nät och röktest
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          cd "$LINUX_PACKAGE"
          python -m venv "$RELEASE_VENV"
          "$RELEASE_VENV/bin/python" -m pip install --no-index --find-links wheelhouse --require-hashes -r requirements.lock
          "$RELEASE_VENV/bin/python" -m pip install --no-index --no-deps dist/*.whl
          reported=$("$RELEASE_VENV/bin/fuzzy-mcp" --version)
          if [ "$reported" != "fuzzy-mcp $VERSION" ]; then
            echo "::error::fuzzy-mcp --version gav '$reported', väntade 'fuzzy-mcp $VERSION' (src/fuzzy_mcp/__init__.py)"; exit 1
          fi
          "$RELEASE_VENV/bin/python" smoke_test.py --stdio -- --sources reference
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: eneo-python
        with:
          python-version: "3.11"
      - name: Installera säkerhetsuppdaterad MCP-klient baserad på Eneo 2.2.2 i en separat miljö
        env:
          ENEO_PYTHON: ${{ steps.eneo-python.outputs.python-path }}
        run: |
          "$ENEO_PYTHON" -m venv "$RUNNER_TEMP/eneo-client"
          "$RUNNER_TEMP/eneo-client/bin/python" -m pip install --only-binary=:all: --require-hashes -r scripts/eneo_client_requirements.txt
      - name: Återinläs levererad image, kontrollera token och Eneo-kompatibilitet
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          tag="fuzzy-mcp:$VERSION"
          expected=$(sed -n "s/^Container-image: $tag //p" "$LINUX_PACKAGE/BUILDINFO.txt")
          if ! [[ "$expected" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::BUILDINFO.txt saknar en giltig image-id"; exit 1
          fi
          test "$(docker image inspect --format '{{.Id}}' "$tag")" = "$expected"
          docker image rm "$tag"
          if docker image inspect "$expected" >/dev/null 2>&1; then
            echo "::error::Den byggda imagen finns kvar före återinläsningen"; exit 1
          fi
          docker load -i "$LINUX_PACKAGE/fuzzy-mcp-$VERSION-image.tar.gz"
          test "$(docker image inspect --format '{{.Id}}' "$tag")" = "$expected"
          token=""
          cleanup() {
            status=$?
            trap - EXIT
            docker rm -f fuzzy-release-notoken fuzzy-release-check >/dev/null 2>&1 || true
            if [ -n "$token" ]; then rm -f -- "$token" || true; fi
            exit "$status"
          }
          trap cleanup EXIT
          rc=0
          timeout 120 docker run --rm --name fuzzy-release-notoken "$tag" || rc=$?
          docker rm -f fuzzy-release-notoken >/dev/null 2>&1 || true
          if [ "$rc" -ne 2 ]; then echo "::error::Imagen utan token avslutades med kod $rc (väntade 2)"; exit 1; fi
          token=$(mktemp "$RUNNER_TEMP/fuzzy-release-token.XXXXXX")
          python -c "import secrets; print(secrets.token_urlsafe(48))" > "$token"
          chmod 644 "$token"
          docker run -d --name fuzzy-release-check -p 127.0.0.1:18080:8000 \
            -e FUZZY_MCP_ALLOWED_HOSTS=localhost -e FUZZY_MCP_STATELESS=true -e FUZZY_MCP_MAX_OUTPUT_CHARS=30000 \
            -v "$token":/run/secrets/fuzzy_mcp_token:ro -e FUZZY_MCP_AUTH_TOKEN_FILE=/run/secrets/fuzzy_mcp_token \
            --read-only --cap-drop ALL --security-opt no-new-privileges "$tag"
          test "$(docker inspect --format '{{.Image}}' fuzzy-release-check)" = "$expected"
          status=starting
          for _ in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' fuzzy-release-check)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs fuzzy-release-check
          test "$status" = healthy
          "$RELEASE_VENV/bin/python" "$LINUX_PACKAGE/smoke_test.py" --url http://127.0.0.1:18080/mcp --token-file "$token"
          "$RUNNER_TEMP/eneo-client/bin/python" "$LINUX_PACKAGE/eneo_check.py" \
            --url http://127.0.0.1:18080/mcp --token-file - < "$token"
      - name: Releasetext
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
        run: |
          python scripts/release_notes.py --version "$VERSION" --changelog CHANGELOG.md \
            --release-dir release --commit "$COMMIT" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > release/RELEASE_NOTES.md
          cat release/RELEASE_NOTES.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          if-no-files-found: error
          retention-days: 7
          path: |
            release/fuzzy-mcp-*.zip
            release/fuzzy-mcp-*.zip.sha256
            release/fuzzy-mcp-*.tar.gz
            release/fuzzy-mcp-*.tar.gz.sha256
            release/RELEASE_NOTES.md

  windows_test:
    name: Windows – installera leveransarkivet offline och kör röktest
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Kontrollera ZIP, installera utan nät och kör paketets stdio-test
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          $archive = Join-Path $PWD "release/fuzzy-mcp-${env:VERSION}-windows-py3.14.zip"
          $package = & python scripts/verify_release.py --archive $archive --out-dir "$env:RUNNER_TEMP/verified-release"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $venv = Join-Path $env:RUNNER_TEMP "release-venv"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $venv "Scripts/python.exe"
          & $python -m pip install --no-index --find-links "$package/wheelhouse" --require-hashes -r "$package/requirements.lock"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = @(Get-ChildItem "$package/dist" -Filter "*.whl")
          if ($wheels.Count -ne 1) { throw "Väntade exakt en fuzzy-mcp-wheel" }
          & $python -m pip install --no-index --no-deps $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $reported = & (Join-Path $venv "Scripts/fuzzy-mcp.exe") --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($reported -ne "fuzzy-mcp $env:VERSION") { throw "Oväntad version: $reported" }
          & $python "$package/smoke_test.py" --stdio -- --sources reference
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Byggproveniens (SLSA) för arkiven som klarat alla kontroller: en signerad koppling arkiv → release.yml → commit,
  # som går att kontrollera med `gh attestation verify` även för en fil från en spegel (docs/DRIFT.md avsnitt 2).
  # Jobbet kör bara GitHubs egna actions, ingen kod från PyPI eller paketen, och är det enda som får signera.
  attest:
    name: Byggproveniens för arkiven
    needs: [build, windows_test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/fuzzy-mcp-*.zip
            release/fuzzy-mcp-*.tar.gz

  release:
    name: Skapa release-utkast
    needs: [build, windows_test, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Utkast med paket, kontrollsummor och releasetext
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          # Fail closed: utan giltig commit skulle utkastet peka på main i stället för den byggda commiten.
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ && "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Ogiltig version '$VERSION' eller commit '$COMMIT' från byggjobbet"; exit 1
          fi
          if ! grep -qF -- "Commit: \`$COMMIT\`" release/RELEASE_NOTES.md; then
            echo "::error::Releasetexten anger inte commit $COMMIT"; exit 1
          fi
          tag="v$VERSION"
          # Bara 404 betyder att taggen saknas; alla andra fel stoppar (fail closed).
          if out=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>&1); then
            echo "::error::Taggen $tag finns redan – höj versionen eller ta bort taggen först"; exit 1
          elif [[ "$out" != *"HTTP 404"* ]]; then
            echo "::error::Kunde inte kontrollera om taggen $tag finns"; echo "$out" >&2; exit 1
          fi
          releases=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName')
          if grep -qxF -- "$tag" <<<"$releases"; then
            echo "::error::Det finns redan en release (eller ett utkast) för $tag"; exit 1
          fi
          cd release
          ls -l
          if ! gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft --target "$COMMIT" \
              --title "fuzzy-mcp $VERSION" --notes-file RELEASE_NOTES.md \
              fuzzy-mcp-*.zip fuzzy-mcp-*.zip.sha256 fuzzy-mcp-*.tar.gz fuzzy-mcp-*.tar.gz.sha256; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
            echo "::error::Utkastet kunde inte skapas helt och har tagits bort – kör flödet igen"; exit 1
          fi
          echo "Utkastet $tag är skapat – granska det under Releases och publicera det." >> "$GITHUB_STEP_SUMMARY"
