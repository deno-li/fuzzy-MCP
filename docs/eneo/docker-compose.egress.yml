#
# Tillägg till docker-compose.fuzzy-mcp.yml: fuzzy-mcp når bara myndigheternas värdar (docs/DRIFT.md avsnitt 6).
# fuzzy_egress blir ett internt nät utan utgång, och all utgående trafik går via en Squid-proxy (egress/) som bara
# släpper fram HTTPS till de sex värdarna. Lägg filen och mappen egress/ bredvid docker-compose.fuzzy-mcp.yml:
#
#   docker compose -f docker-compose.fuzzy-mcp.yml -f docker-compose.egress.yml build
#   docker compose -f docker-compose.fuzzy-mcp.yml -f docker-compose.egress.yml down   # nätet måste skapas om
#   docker compose -f docker-compose.fuzzy-mcp.yml -f docker-compose.egress.yml up -d
#
# Bygg först: misslyckas bygget kör den gamla versionen vidare. `down` behövs när nätet tidigare skapats utan
# tillägget: annars ligger fuzzy_egress kvar som ett vanligt nät med utgång. Kontrollera efteråt:
#   docker network inspect fuzzy-mcp_fuzzy_egress --format '{{.Internal}}'  → true
#
# Bygget hämtar ubuntu:24.04 och Squid; bakom en proxy: --build-arg http_proxy=… --build-arg https_proxy=… till
# `docker compose build`. Kräver organisationen att all trafik går via en egen proxy: avkommentera både cache_peer
# och never_direct i egress/squid.conf. Ändringar i squid.conf gäller efter `docker restart fuzzy-egress-proxy`
# (filen monteras skrivskyddad). Proxyns logg (`docker logs fuzzy-egress-proxy`) visar en rad per anslutning med
# värdnamn och status; TCP_DENIED/403 betyder att något försökte nå en annan adress.

services:
  fuzzy-mcp:
    environment:
      HTTPS_PROXY: http://fuzzy-egress-proxy:3128
    depends_on: [fuzzy-egress-proxy]

  fuzzy-egress-proxy:
    build: ./egress
    image: fuzzy-mcp-egress-proxy:local
    container_name: fuzzy-egress-proxy
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 64
    # Squid dimensionerar sina tabeller efter gränsen för öppna filer (se max_filedescriptors i squid.conf).
    ulimits:
      nofile: {soft: 4096, hard: 4096}
    volumes:
      - ./egress/squid.conf:/etc/squid/squid.conf:ro
    # fuzzy_egress: nås av fuzzy-mcp. fuzzy_outbound: proxyns enda väg ut.
    networks: [fuzzy_egress, fuzzy_outbound]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  fuzzy_egress:
    internal: true
  fuzzy_outbound:
    driver: bridge
