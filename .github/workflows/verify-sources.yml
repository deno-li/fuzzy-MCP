# Källkontroll: kör scripts/verify_sources.py mot källornas öppna API:er och skriver svaren i jobbloggen
# (VERIFY/BODY/TEXT/B64-rader) och en statustabell i körningens sammanfattning. Används för att kontrollera
# API-kontrakt och hämta SCB:s nyckelfiler när utvecklingsmiljön saknar nätåtkomst till källorna.
# Startas för hand (Actions → Källkontroll → Run workflow). Bara läsande GET-anrop till en fast lista med värdar,
# bara standardbiblioteket, inga hemligheter och ingen skrivrätt.
name: Källkontroll

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-sources-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Källkontroll (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [scb-geodata, scb-pxweb, scb-nycklar, socialstyrelsen]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Kontrollera källorna
        env:
          GROUP: ${{ matrix.group }}
        run: python -I scripts/verify_sources.py --group "$GROUP"
